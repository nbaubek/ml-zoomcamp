<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="t">Purchase-Intent Prediction Service</title>
  <desc id="d">Banner showing a shopping cart and a live session scored with a purchase probability of 0.81, above the 0.15 intervention threshold.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#DD8452"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" rx="18" fill="url(#bg)"/>
  <circle cx="1120" cy="-10" r="170" fill="#ffffff" opacity="0.04"/>
  <circle cx="620" cy="330" r="150" fill="#ffffff" opacity="0.04"/>

  <!-- left: title block -->
  <text x="60" y="92" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="4" fill="#93c5fd">ML ZOOMCAMP MIDTERM</text>
  <text x="60" y="150" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="54" font-weight="800" fill="#ffffff">Purchase-Intent</text>
  <text x="60" y="206" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="54" font-weight="800" fill="#ffffff">Prediction Service</text>
  <text x="60" y="248" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" fill="#cbd5e1">Will this session end in a purchase? Know before they leave.</text>

  <!-- right: live session card -->
  <rect x="700" y="58" width="440" height="184" rx="16" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.22"/>

  <!-- cart icon -->
  <g transform="translate(728 82)" fill="none" stroke="#DD8452" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M0 2 H7 L13 26 H34 L39 8 H10"/>
    <circle cx="16" cy="34" r="3.2" fill="#DD8452"/>
    <circle cx="31" cy="34" r="3.2" fill="#DD8452"/>
  </g>
  <text x="786" y="97" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#cbd5e1">live session</text>
  <text x="786" y="118" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#94a3b8">pages viewed, durations, page values, exit rate</text>

  <text x="730" y="168" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" font-weight="800" fill="#ffffff">p(purchase) = 0.81</text>

  <!-- probability bar: track 380 wide, fill 81% = 308, threshold at 15% = 57 -->
  <rect x="730" y="184" width="380" height="14" rx="7" fill="#ffffff" fill-opacity="0.16"/>
  <rect x="730" y="184" width="308" height="14" rx="7" fill="url(#bar)"/>
  <line x1="787" y1="178" x2="787" y2="204" stroke="#ffffff" stroke-width="2"/>
  <text x="730" y="224" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#cbd5e1">threshold 0.15</text>
  <text x="1110" y="224" text-anchor="end" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#DD8452">intervene</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
